name: Build macOS arm64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build floresta for Apple Silicon
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          sw_vers

      - name: Install system dependencies
        run: |
          brew update
          brew install gcc pkg-config cmake

      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup target add aarch64-apple-darwin

      - name: Build release binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin florestad --bin floresta-cli

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/florestad dist/
          cp target/aarch64-apple-darwin/release/floresta-cli dist/
          tar -czf floresta-macos-arm64.tar.gz -C dist florestad floresta-cli
          shasum -a 256 floresta-macos-arm64.tar.gz > floresta-macos-arm64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: floresta-macos-arm64
          path: |
            floresta-macos-arm64.tar.gz
            floresta-macos-arm64.sha256

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" floresta-macos-arm64.tar.gz floresta-macos-arm64.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" floresta-macos-arm64.tar.gz floresta-macos-arm64.sha256 --title "$GITHUB_REF_NAME" --generate-notes
          fi
